{% extends 'layout.html' %}

{% block title %}{{ course.title }}{% endblock %}

{% block content %}
<div class="course-details">
    <h1>{{ course.title }}</h1>
    <p>{{ course.description }}</p>
    <h2>Instructor: {{ course.instructor }}</h2>
    <h3>Duration: {{ course.duration }}</h3>
</div>
{% endblock %}
